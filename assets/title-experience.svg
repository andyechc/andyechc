<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130" role="img" aria-label="What the years taught me.">
  <style>
    .eb { fill: #59636e; }
    .tt { fill: #0b2530; }
    .ac { fill: #0e9aa7; }
    @media (prefers-color-scheme: dark) {
      .eb { fill: #7fb8bd; }
      .tt { fill: #f2f0ea; }
      .ac { fill: #2dd4bf; }
    }
  </style>
  <defs>
    <linearGradient id="dexperience" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8c6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#14b8c6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#14b8c6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="5" class="eb">EXPERIENCE</text>
  <text x="450" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.5" class="tt">What the years <tspan class="ac">taught me.</tspan></text>
  <rect x="370" y="102" width="160" height="1.5" rx="0.75" fill="url(#dexperience)"/>
</svg>
