<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="andyechc — I build software. Thoughtfully.">
  <style>
    .bg { fill: #f2f0ea; }
    .grid { stroke: #0a0a0a; }
    .f1 { stop-color: #f2f0ea; stop-opacity: 0; }
    .f2 { stop-color: #f2f0ea; stop-opacity: 0.5; }
    .nm { fill: #0b2530; }
    .eb { fill: #0e7a86; }
    .tt { fill: #0a0a0a; }
    .ac { fill: #0e9aa7; }
    .ring { stroke: #0e9aa7; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0a0a0a; }
      .grid { stroke: #ffffff; }
      .f1 { stop-color: #0a0a0a; stop-opacity: 0; }
      .f2 { stop-color: #0a0a0a; stop-opacity: 0.55; }
      .nm { fill: #f2f0ea; }
      .eb { fill: #7fb8bd; }
      .tt { fill: #f2f0ea; }
      .ac { fill: #2dd4bf; }
      .ring { stroke: #2dd4bf; }
    }
  </style>
  <defs>
    <radialGradient id="glow" cx="50%" cy="115%" r="65%">
      <stop offset="0%" stop-color="#14b8c6" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#14b8c6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#14b8c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" class="f1"/>
      <stop offset="100%" class="f2"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" class="grid" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="bottomfade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="softbottom" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="200">
      <rect width="900" height="200" fill="url(#bottomfade)"/>
    </mask>
    <clipPath id="topround">
      <path d="M24,0 H876 Q900,0 900,24 V200 H0 V24 Q0,0 24,0 Z"/>
    </clipPath>
    <clipPath id="av"><circle cx="408" cy="30" r="13"/></clipPath>
  </defs>

  <g clip-path="url(#topround)">
    <g mask="url(#softbottom)">
      <rect width="900" height="200" class="bg"/>
      <rect width="900" height="200" fill="url(#grid)"/>
      <rect width="900" height="200" fill="url(#fade)"/>
      <ellipse cx="450" cy="235" rx="380" ry="80" fill="url(#glow)"/>
    </g>
  </g>

  <text x="444" y="56" text-anchor="middle" font-family="Instrument Serif, Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" class="tt">æ</text>
  <circle cx="474" cy="49" r="4.5" class="ac" fill="#2dd4bf"/>

  <text x="450" y="86" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="6" class="eb">SOFTWARE DEVELOPER</text>
  <text x="450" y="138" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="42" font-weight="600" letter-spacing="-1" class="tt">I build software. <tspan class="ac">Thoughtfully.</tspan></text>
</svg>
